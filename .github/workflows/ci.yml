name: CI

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    name: Tests and retrieval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set Hugging Face cache directory
        run: echo "HF_HOME=$RUNNER_TEMP/huggingface" >> "$GITHUB_ENV"

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ${{ env.HF_HOME }}/hub
          key: hf-models-${{ runner.os }}-${{ hashFiles('src/config.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Build pinned heading indexes
        run: python -m scripts.build_artifacts

      - name: Check DEV recall@5
        run: python -m eval.ci_retrieval --baseline eval/baseline.json